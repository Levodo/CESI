# =====================================================================================
# spark-defaults.conf — Configuration par defaut d'Apache Spark
#                        Default Apache Spark configuration
#
# POURQUOI / WHY :
#   Evite de re-passer 15 options a chaque spark-submit : les valeurs communes
#   (catalogue Hive, compression Parquet, pilote JDBC) sont definies ICI, une fois.
#   Avoids re-passing 15 options on every spark-submit: common values
#   (Hive catalog, Parquet compression, JDBC driver) are defined HERE, once.
#
# COMMENT / HOW :
#   Monte dans /opt/spark/conf de TOUS les conteneurs Spark ET du conteneur Airflow
#   (qui soumet les jobs). Voir docker-compose.yml.
#   Mounted into /opt/spark/conf of ALL Spark containers AND the Airflow container
#   (which submits jobs). See docker-compose.yml.
#
# VERIFICATION :
#   Dans un job : spark.sparkContext.getConf().get("spark.sql.parquet.compression.codec")
#   doit valoir "snappy".
# =====================================================================================

# --- Catalogue Hive ---------------------------------------------------------------
# POURQUOI : permet d'ecrire des tables SQL (bronze_db.*, silver_db.*, gold_db.*)
#            qui apparaissent dans Hive et sont requetables en SQL.
# WHY     : allows writing SQL tables visible in Hive, queryable in SQL.
spark.sql.catalogImplementation  hive
spark.sql.hive.metastore.version  2.3.9
spark.sql.hive.metastore.jars     builtin

# --- Stockage ----------------------------------------------------------------------
# POURQUOI : Parquet = format colonne compresse (x5 a x10 sur ce type de donnees),
#            snappy = bon compromis vitesse/taille. "dynamic" = on ne remplace que
#            la partition du jour, pas toute la table (idempotence des rejeux).
# WHY     : Parquet = compressed columnar format; snappy = speed/size compromise.
#           "dynamic" = only the day's partition is replaced (idempotent reruns).
spark.sql.parquet.compression.codec      snappy
spark.sql.sources.partitionOverwriteMode dynamic

# --- Pilote JDBC PostgreSQL (couche de service Gold / Gold serving layer) ----------
# POURQUOI : spark.jars distribue le pilote aux DRIVERS ET EXECUTEURS : obligatoire
#            pour df.write.format("jdbc") depuis un cluster.
# WHY     : spark.jars ships the driver to drivers AND executors: required for
#           df.write.format("jdbc") from a cluster.
spark.jars  /opt/spark/jars/postgresql-42.6.0.jar

# --- Memoire (machine de developpement / development machine) ----------------------
# POURQUOI : valeurs modestes et explicites pour eviter les "Out Of Memory" sur un
#            poste de 16 Go qui porte aussi Airflow et Hive.
# WHY     : modest explicit values to avoid OOM on a 16 GB dev machine.
spark.driver.memory    1g
spark.executor.memory  1g
# POURQUOI executor.cores / cores.max : sans limite, UN job prend TOUS les cœurs du
#            worker ("--cores 16" observe dans les logs) : les autres jobs attendent
#            indefiniment ("Initial job has not accepted any resources") et le master
#            crie "requires more resource than any of Workers could have". Limiter a
#            2 cœurs/executeur et 4 cœurs/job => 4 jobs reels en parallele.
# WHY     : without a limit, ONE job takes ALL worker cores ("--cores 16" seen in
#           logs): other jobs wait forever and the master complains. Capping at
#           2 cores/executor and 4 cores/job => 4 truly parallel jobs.
spark.executor.cores   2
spark.cores.max        4
spark.sql.shuffle.partitions  8

# --- Python ----------------------------------------------------------------------
# POURQUOI : les jobs sont en PySpark ; on force python3 du conteneur.
# WHY     : jobs are PySpark; force the container's python3.
spark.pyspark.python  python3
